<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<title>Andrew's Gym Log</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E4E7EA;--ink:#14181C;--mute:#5C6670;--line:#C5CBD1;--acc:#1D5FC4;--onacc:#fff;--done:#2E8B57;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161A;--ink:#EEF1F4;--mute:#97A1AB;--line:#2C343B;--acc:#6FA3F5;--onacc:#0C1219;--done:#5CC48A}}
:root[data-theme="dark"]{--bg:#12161A;--ink:#EEF1F4;--mute:#97A1AB;--line:#2C343B;--acc:#6FA3F5;--onacc:#0C1219;--done:#5CC48A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.35 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font:700 30px/1 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;margin:4px 0 14px;letter-spacing:.01em}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;min-height:46px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:700 20px "Barlow Condensed","Arial Narrow",system-ui,sans-serif}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.days button{min-height:42px;font-size:18px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .25s}
.count{color:var(--mute);font-size:14px;margin:0 0 6px}
h2{font:700 22px/1 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;margin:22px 0 4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .n{font-weight:600;font-size:17px}
.row .m{color:var(--mute);font-size:18px;margin-top:4px}
.row.ok .n{color:var(--mute);text-decoration:line-through}
.dots{display:flex;gap:8px;flex-shrink:0}
.dot{width:46px;height:46px;border-radius:50%;border:2px solid var(--acc);background:transparent;color:var(--acc);font:700 18px "Barlow Condensed",system-ui,sans-serif;padding:0}
.dot[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--onacc)}
.dot:focus-visible,.seg button:focus-visible,.finish:focus-visible,.reset:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.finish{margin-top:22px;width:100%;min-height:48px;border:0;background:var(--acc);color:var(--onacc);border-radius:10px;font:700 20px "Barlow Condensed","Arial Narrow",system-ui,sans-serif}
.reset{margin-top:10px;width:100%;min-height:46px;border:2px solid var(--line);background:transparent;color:var(--mute);border-radius:10px;font:600 16px Barlow,system-ui,sans-serif}
.hint{color:var(--mute);font-size:13px;margin-top:14px}
.logh{margin-top:28px}
.entry{padding:12px 0;border-bottom:1px solid var(--line)}
.entry .n{font-weight:600}
</style>
</head>
<body>
<main>
<h1>Gym log - Andy Hill</h1>
<div class="seg" id="vs"></div>
<div class="seg days" id="ds"></div>
<div class="bar"><i id="pb"></i></div>
<p class="count" id="ct"></p>
<div id="out"></div>
<button class="finish" id="fn">Finished for today</button>
<button class="reset" id="rs">Clear this day</button>
<h2 class="logh">Record</h2>
<div id="lg"></div>
<p class="hint">Tap a circle for each set. Tap Finished for today to save this session on this phone.</p>
</main>
<script>
var R=function(n,l,s,r,t){return{n:n,l:l,s:s,r:r,t:t}};
var UP=[["Rower","3 min"],["Child's pose with push-up","20 reps"]];
var LG=[["Rower","3 min"],["Toe touches","20 reps"]];
var LEGS=[R("Smith machine RDL","15 kg each side",3,10,"2:00"),R("Smith machine split squats","5 kg each side",3,10,"2:00"),R("Barbell hip thrusts","5 kg",3,10,"1:30"),R("Leg extensions (single leg)","23 kg",3,10,"1:00"),R("Leg curls (single leg)","23 kg",3,10,"1:00"),R("Calf raises","10 kg each side",3,10,"1:00")];
var P={
"3":[
{t:"Pull",w:UP,e:[R("Cable rows","52 kg",3,10,"1:30"),R("Lat pulldown","34 kg",3,14,"1:30"),R("Face pulls","30 kg",3,10,"1:30"),R("DB bench curls","6 kg",3,12,"1:00"),R("Hammer curls","5 kg",3,10,"1:00"),R("Aleknas","Bodyweight",3,10,"1:00")]},
{t:"Legs",w:LG,e:LEGS},
{t:"Push",w:UP,e:[R("Chest press machine","30 kg",3,12,"1:30"),R("Chest flys (mid 25)","14 kg each side",3,12,"1:30"),R("Shoulder press machine","23 kg",3,10,"1:30"),R("Cable lateral raise","9 kg",3,12,"1:00"),R("Overhead extensions","23 kg",3,12,"1:00"),R("Rope pushdown","18 kg",2,8,"1:00")]}],
"2":[
{t:"Upper",w:UP,e:[R("Cable rows","52 kg",3,10,"1:30"),R("Lat pulldown","34 kg",3,14,"1:30"),R("Chest press machine","30 kg",3,12,"1:30"),R("Shoulder press machine","23 kg",3,10,"1:30"),R("DB bench curls","6 kg",3,12,"1:00"),R("Rope pushdown","23 kg",3,12,"1:00"),R("Aleknas","Bodyweight",3,10,"1:00")]},
{t:"Legs",w:LG,e:LEGS}]
};
var S={v:"3",d:0,done:{},log:[]},KEY="andrew-gym-v1",armed=false,note="";
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&P[o.v]){S.v=o.v;S.d=P[o.v][o.d]?o.d:0;S.done=o.done||{};S.log=Array.isArray(o.log)?o.log:[]}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function pre(){return S.v+"-"+S.d+":"}
function keys(){var day=P[S.v][S.d],k=[],p=pre();day.w.forEach(function(_,i){k.push(p+"w"+i)});day.e.forEach(function(x,i){for(var s=0;s<x.s;s++)k.push(p+"e"+i+":s"+s)});return k}
function doneCount(ks){return ks.filter(function(k){return S.done[k]}).length}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function when(t){try{return new Date(t).toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}catch(err){return ""}}
function pctOf(n,total){return total?Math.round(100*n/total):0}
function record(){
 var ks=keys(),n=doneCount(ks);if(!n)return;
 var day=P[S.v][S.d],p=pre(),lines=[];
 day.w.forEach(function(w,i){if(S.done[p+"w"+i])lines.push(w[0])});
 day.e.forEach(function(x,i){var c=0;for(var s=0;s<x.s;s++)if(S.done[p+"e"+i+":s"+s])c++;if(c)lines.push(x.n+" "+c+"/"+x.s)});
 S.log.unshift({t:Date.now(),title:"Day "+(S.d+1)+" "+day.t,plan:S.v+" days a week",n:n,total:ks.length,pct:pctOf(n,ks.length),lines:lines});
 if(S.log.length>60)S.log.length=60;
}
function dot(k,label){return '<button class="dot" data-k="'+k+'" aria-pressed="'+(!!S.done[k])+'" aria-label="'+label+'">'+(S.done[k]?"&#10003;":label.slice(-1))+'</button>'}
function render(){
 var day=P[S.v][S.d],p=pre(),h="";
 document.getElementById("vs").innerHTML=["3","2"].map(function(v){return '<button data-v="'+v+'" aria-pressed="'+(S.v===v)+'">'+v+' days a week</button>'}).join("");
 document.getElementById("ds").innerHTML=P[S.v].map(function(d,i){return '<button data-d="'+i+'" aria-pressed="'+(S.d===i)+'">Day '+(i+1)+' '+d.t+'</button>'}).join("");
 h+="<h2>Warm up</h2>";
 day.w.forEach(function(w,i){var k=p+"w"+i;h+='<div class="row'+(S.done[k]?" ok":"")+'"><div><div class="n">'+w[0]+'</div><div class="m">'+w[1]+'</div></div><div class="dots">'+dot(k,"Done")+'</div></div>'});
 h+="<h2>Workout</h2>";
 day.e.forEach(function(x,i){var all=true,d="";for(var s=0;s<x.s;s++){var k=p+"e"+i+":s"+s;if(!S.done[k])all=false;d+=dot(k,"Set "+(s+1))}
  h+='<div class="row'+(all?" ok":"")+'"><div><div class="n">'+x.n+'</div><div class="m">'+x.l+' &middot; '+x.s+' &times; '+x.r+' &middot; rest '+x.t+'</div></div><div class="dots">'+d+'</div></div>'});
 document.getElementById("out").innerHTML=h;
 var ks=keys(),n=ks.filter(function(k){return S.done[k]}).length;
 document.getElementById("pb").style.width=(100*n/ks.length)+"%";
 document.getElementById("ct").textContent=note||(n+" of "+ks.length+" done · "+pctOf(n,ks.length)+"%");
 document.getElementById("rs").textContent=armed?"Tap again to clear":"Clear this day";
 var lg=document.getElementById("lg");
 if(!S.log.length){lg.innerHTML='<p class="count">Nothing here yet. Tap Finished for today to save this session.</p>';return}
 lg.innerHTML=S.log.map(function(e){
  var status=(typeof e.pct==="number"?e.pct:pctOf(e.n,e.total))+"% · "+e.n+" of "+e.total;
  return '<div class="entry"><div class="n">'+esc(when(e.t))+'</div><div class="m">'+esc(e.plan+" · "+e.title+" · "+status)+'</div><div class="m">'+esc((e.lines||[]).join(" · "))+'</div></div>';
 }).join("");
}
document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.dataset.k){if(S.done[b.dataset.k])delete S.done[b.dataset.k];else S.done[b.dataset.k]=1}
 else if(b.dataset.v){S.v=b.dataset.v;S.d=0}
 else if(b.dataset.d){S.d=+b.dataset.d}
 else if(b.id==="fn"){
  var fk=keys();
  if(!doneCount(fk)){note="Tick a set first.";render();return}
  record();
  fk.forEach(function(key){delete S.done[key]});
 }
 else if(b.id==="rs"){
  if(!armed){armed=true;render();return}
  keys().forEach(function(key){delete S.done[key]});
 }
 armed=false;note="";save();render();
});
render();
</script>
</body>
</html>
